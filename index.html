<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumexa - Next Gen AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob-bg"></div>
    
    <nav class="glass-nav">
        <div class="logo">Lumexa</div>
        <ul class="nav-links">
            <li><a href="#features">Features</a></li>
            <li><a href="#about">About</a></li>
            <li><button class="cta-btn btn-small">Get Started</button></li>
        </ul>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1 class="animate-up">Experience the Future<br><span class="gradient-text">with Lumexa</span></h1>
            <p class="animate-up delay-1">The fastest path from prompt to production. Harness the power of Gemini AI to build stunning experiences.</p>
            <div class="cta-group animate-up delay-2">
                <button class="cta-btn primary">Start Building</button>
                <button class="cta-btn secondary">Learn More</button>
            </div>
        </div>
        
        <div class="hero-visual animate-fade delay-3">
            <div class="glass-card">
                <div class="code-block">
                    <span class="keyword">const</span> <span class="variable">lumexa</span> = <span class="keyword">new</span> <span class="function">AI</span>();
                    <br>
                    <span class="variable">lumexa</span>.<span class="function">generate</span>(<span class="string">"amazing web app"</span>);
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
